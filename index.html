<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Governmint: freshly minted governments</title>
    <meta name="description" content="Set up a country and see what kind of state you've made: its name, why, and where it contradicts itself. Free, in your browser, no account needed." />
    <meta id="theme-color" name="theme-color" content="#ffffff" />
    <script>
      // Light or dark before the page paints, so dark pages don't flash white (see ThemeSwitch.svelte).
      (function () {
        var d = document.documentElement, t = null;
        try { t = localStorage.getItem('governmint:theme'); } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        d.dataset.theme = dark ? 'dark' : 'light';
        document.getElementById('theme-color').setAttribute('content', dark ? '#002b36' : '#ffffff');
      })();
    </script>
    <link rel="canonical" href="https://gov.eurth.org/" />
    <!-- Link previews (Reddit, Facebook, LinkedIn, X, Bluesky, Mastodon, Discord, Slack,
         WhatsApp, iMessage): Open Graph, plus X's large card. scripts/og-image.html makes og.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Governmint, by Eurth" />
    <meta property="og:url" content="https://gov.eurth.org/" />
    <meta property="og:title" content="Governmint: freshly minted governments" />
    <meta property="og:description" content="Set up a country's government and budget, and see what kind of state you've made: its name, why, and where it contradicts itself. Free, in your browser, no account needed." />
    <meta property="og:image" content="https://gov.eurth.org/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Governmint, freshly minted governments, at gov.eurth.org: the Eurth yurt above the name, with a spider chart behind it." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Governmint, freshly minted governments, at gov.eurth.org: the Eurth yurt above the name, with a spider chart behind it." />
    <!-- The Eurth globe. A still frame for every browser; src/ui/favicon.ts turns it where the
         browser allows (not Safari). favicon.ico is there for browsers that look for it by name. -->
    <link id="favicon" rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
